<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сборщик PDF</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      --accent: rgba(94, 114, 235, 0.8);
      --accent-hover: rgba(94, 114, 235, 1);
      --text: #ffffff;
      --text-sec: rgba(255, 255, 255, 0.6);
      --danger: rgba(255, 69, 58, 0.8);
      --radius: 24px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0914; /* Глубокий темный цвет основы */
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
      padding-bottom: 120px;
      overflow-x: hidden;
    }

    /* Анимированные сферы на фоне для эффекта стекла */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      animation: float 12s infinite alternate ease-in-out;
    }
    .blob-1 { background: #4f2991; width: 50vw; height: 50vw; top: -10%; left: -10%; }
    .blob-2 { background: #1f4287; width: 60vw; height: 60vw; bottom: -20%; right: -10%; animation-delay: -4s; }
    .blob-3 { background: #8b2252; width: 40vw; height: 40vw; top: 40%; left: 40%; animation-duration: 18s; opacity: 0.5; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      border-left: 1px solid var(--glass-highlight);
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    header p {
      color: var(--text-sec);
      font-size: 15px;
    }

    /* Зона загрузки (стекло внутри стекла) */
    .dropzone {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dropzone:hover, .dropzone.dragover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
    }

    .dropzone svg {
      width: 40px;
      height: 40px;
      color: var(--text-sec);
      transition: color 0.3s;
    }

    .dropzone:hover svg { color: #fff; }

    .dropzone p { font-size: 16px; font-weight: 500; }
    .dropzone span { font-size: 13px; color: var(--text-sec); }
    .dropzone input { display: none; }

    /* Сетка изображений */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .preview-item {
      position: relative;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .preview-item:hover img { transform: scale(1.08); }

    .page-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 69, 58, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: rgba(255, 69, 58, 0.9);
      transform: scale(1.1);
    }

    /* Плавающий бар действий (стеклянный) */
    .action-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 500px;
      background: rgba(20, 20, 25, 0.6);
      backdrop-filter: blur(40px) saturate(150%);
      -webkit-backdrop-filter: blur(40px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px;
      border-radius: 28px;
      display: flex;
      gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translate(-50%, 20px);
    }

    .action-bar.visible {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, 0);
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-top: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(94, 114, 235, 0.4);
    }

    .btn-primary:active {
      background: var(--accent-hover);
      transform: scale(0.98);
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      width: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:active { background: rgba(255, 255, 255, 0.15); transform: scale(0.95); }
    .btn-icon:hover { color: var(--danger); border-color: rgba(255, 69, 58, 0.4); }

    /* Экран загрузки (матовое стекло на весь экран) */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

  </style>
</head>
<body>

<!-- Анимированные фоновые сферы -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="container">
  <div class="glass-panel">
    <header>
      <h1>Сборщик PDF</h1>
      <p>Склейка файлов прямо на устройстве</p>
    </header>

    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
      <p>Выбрать фото</p>
      <span>или перетащить файлы сюда</span>
    </label>
  </div>

  <div class="preview-grid" id="grid"></div>
</div>

<div class="action-bar" id="actionBar">
  <button class="btn-icon" id="clearBtn" title="Очистить всё">
    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
  </button>
  <button class="btn-primary" id="buildBtn">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    <span id="btnText">Собрать PDF</span>
  </button>
</div>

<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <h3>Оптимизация и сборка...</h3>
</div>

<script>
  let images = [];

  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const grid = document.getElementById('grid');
  const actionBar = document.getElementById('actionBar');
  const btnText = document.getElementById('btnText');
  const buildBtn = document.getElementById('buildBtn');
  const clearBtn = document.getElementById('clearBtn');
  const overlay = document.getElementById('overlay');

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropzone.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
  });

  dropzone.addEventListener('drop', (e) => {
    handleFiles(e.dataTransfer.files);
  }, false);

  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    fileInput.value = '';
  });

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (file.type.startsWith('image/')) {
        images.push({
          file: file,
          url: URL.createObjectURL(file)
        });
      }
    });
    render();
  }

  function render() {
    grid.innerHTML = '';
    images.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = 'preview-item';
      el.innerHTML = `
        <img src="${item.url}" alt="Скан ${index + 1}">
        <span class="page-badge">${index + 1}</span>
        <button class="delete-btn" onclick="removeImage(${index})">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      `;
      grid.appendChild(el);
    });

    const count = images.length;
    if (count > 0) {
      actionBar.classList.add('visible');
      btnText.textContent = `Собрать PDF (${count})`;
    } else {
      actionBar.classList.remove('visible');
    }
  }

  window.removeImage = function(index) {
    URL.revokeObjectURL(images[index].url);
    images.splice(index, 1);
    render();
  };

  clearBtn.addEventListener('click', () => {
    images.forEach(img => URL.revokeObjectURL(img.url));
    images = [];
    render();
  });

  buildBtn.addEventListener('click', async () => {
    if (images.length === 0) return;
    overlay.classList.add('active');

    try {
      await new Promise(r => setTimeout(r, 100)); 
      const pdfDoc = await PDFLib.PDFDocument.create();

      for (const item of images) {
        const buffer = await item.file.arrayBuffer();
        let pdfImage;

        try {
          if (item.file.type === 'image/png') {
            pdfImage = await pdfDoc.embedPng(buffer);
          } else {
            pdfImage = await pdfDoc.embedJpg(buffer);
          }
        } catch (e) {
          const img = new Image();
          img.src = item.url;
          await img.decode();
          
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          
          const jpgDataUrl = canvas.toDataURL('image/jpeg', 0.85);
          const jpgBuffer = await (await fetch(jpgDataUrl)).arrayBuffer();
          pdfImage = await pdfDoc.embedJpg(jpgBuffer);
        }

        const page = pdfDoc.addPage([pdfImage.width, pdfImage.height]);
        page.drawImage(pdfImage, {
          x: 0,
          y: 0,
          width: pdfImage.width,
          height: pdfImage.height,
        });
      }

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const downloadUrl = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = downloadUrl;
      const dateStr = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
      link.download = `Document_${dateStr}.pdf`;
      link.click();

      setTimeout(() => URL.revokeObjectURL(downloadUrl), 5000);
      
      images.forEach(img => URL.revokeObjectURL(img.url));
      images = [];
      render();

    } catch (err) {
      alert('Ошибка при сборке: ' + err.message);
    } finally {
      overlay.classList.remove('active');
    }
  });
</script>

</body>
</html>
